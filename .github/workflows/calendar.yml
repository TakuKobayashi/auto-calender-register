name: Mail calendar

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: '受信開始日 YYYY-MM-DD（空欄は先月初日）'
        type: string
      apply:
        description: 'Googleカレンダーへ実際に登録する'
        type: boolean
        default: true
      model:
        description: 'Ollamaモデル（空欄はルール方式のみ）'
        type: string
        default: 'qwen3.5:9b'
      mailbox:
        description: '取得対象フォルダー（複数はカンマ区切り）'
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: mail-calendar
  cancel-in-progress: false

jobs:
  calendar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      OLLAMA_VERSION: v0.40.16
      OLLAMA_ARCHIVE_SHA256: 87bfafb2acbc89b2e6a1be0a9043de6aa75fb450696f86bc426e65fc448f788d
      OLLAMA_MODEL: ${{ github.event_name == 'schedule' && (vars.OLLAMA_MODEL || 'qwen3.5:9b') || inputs.model }}
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_TIMEOUT_MS: '600000'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      SCAN_SINCE: ${{ inputs.since }}
      SCAN_MAILBOX: ${{ inputs.mailbox || vars.YAHOO_IMAP_MAILBOX || 'INBOX' }}
      APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check required secrets
        env:
          YAHOO_IMAP_USER: ${{ secrets.YAHOO_IMAP_USER }}
          YAHOO_IMAP_PASSWORD: ${{ secrets.YAHOO_IMAP_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          for name in YAHOO_IMAP_USER YAHOO_IMAP_PASSWORD GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set runner paths
        run: |
          {
            echo "DB_ARTIFACT_DIR=$RUNNER_TEMP/calendar-db"
            echo "OLLAMA_DIR=$RUNNER_TEMP/ollama"
            echo "OLLAMA_MODELS=$RUNNER_TEMP/ollama/models"
          } >> "$GITHUB_ENV"

      - name: Find latest SQL artifact
        id: db_history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" |
            jq -c --arg branch "$GITHUB_REF_NAME" --argjson repo "$GITHUB_REPOSITORY_ID" \
              '[.[].artifacts[] |
                select((.name | test("^mail-calendar-sql-[0-9]+-[0-9]+$")) and
                  .expired == false and .workflow_run.head_branch == $branch and
                  .workflow_run.head_repository_id == $repo)] |
                sort_by(.created_at, .id)')
          jq -r '"artifact_id=\(last | .id // "")",
                 "run_id=\(last | .workflow_run.id // "")",
                 "old_ids=\(map(.id) | join(" "))"' <<< "$artifacts" >> "$GITHUB_OUTPUT"
      - name: Download latest SQL artifact
        if: steps.db_history.outputs.artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.db_history.outputs.artifact_id }}
          run-id: ${{ steps.db_history.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.DB_ARTIFACT_DIR }}
      - name: Set up empty database
        run: npm run task db:setup
      - name: Restore SQL snapshot
        id: load_database
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          PRIOR_ARTIFACT_ID: ${{ steps.db_history.outputs.artifact_id }}
        run: |
          if [[ -z "$PRIOR_ARTIFACT_ID" ]]; then
            echo 'No previous SQL artifact. Starting with an empty database.'
            exit 0
          fi
          mkdir -p db/dumps
          printf '%s\n' "$GOOGLE_REFRESH_TOKEN" |
            gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              --decrypt "$DB_ARTIFACT_DIR/calendar-db.tar.gz.gpg" |
            tar -xzf - -C db/dumps
          npm run --silent db:restore |
            jq -r '.tables | map({key: .name, value: .rows}) | from_entries |
              "SQL復元: メール \(.mails)件 / LLM判定キャッシュ \(.extractions)件 / 登録状態 \(.calendar_states)件"'

      - name: Restore Ollama and model
        if: env.OLLAMA_MODEL != ''
        id: ollama_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.OLLAMA_DIR }}
          key: ollama-cpu-${{ runner.os }}-${{ runner.arch }}-${{ env.OLLAMA_VERSION }}-${{ env.OLLAMA_MODEL }}
      - name: Start local Ollama
        if: env.OLLAMA_MODEL != ''
        run: |
          ollama="$OLLAMA_DIR/bin/ollama"
          if [[ ! -x "$ollama" ]]; then
            mkdir -p "$OLLAMA_DIR"
            archive="$RUNNER_TEMP/ollama-linux-amd64.tar.zst"
            curl --fail --silent --show-error --location --retry 3 \
              "https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSION/ollama-linux-amd64.tar.zst" \
              --output "$archive"
            printf '%s  %s\n' "$OLLAMA_ARCHIVE_SHA256" "$archive" | sha256sum --check
            tar --zstd --exclude='*/ollama/cuda*' --exclude='*/ollama/vulkan*' -xf "$archive" -C "$OLLAMA_DIR"
            rm -f "$archive"
          fi
          "$ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fs http://127.0.0.1:11434/api/tags >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/ollama.log" >&2
            exit 1
          fi
          if ! "$ollama" show "$OLLAMA_MODEL" >/dev/null 2>&1; then
            "$ollama" pull "$OLLAMA_MODEL"
          fi
      - name: Save Ollama and model
        if: env.OLLAMA_MODEL != '' && steps.ollama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.OLLAMA_DIR }}
          key: ${{ steps.ollama_cache.outputs.cache-primary-key }}

      - name: Collect and classify
        id: selection
        timeout-minutes: 271
        env:
          YAHOO_IMAP_USER: ${{ secrets.YAHOO_IMAP_USER }}
          YAHOO_IMAP_PASSWORD: ${{ secrets.YAHOO_IMAP_PASSWORD }}
        run: |
          args=(run --silent calendar:dry-run -- --database --no-mail-details --mailbox "$SCAN_MAILBOX")
          if [[ -n "$SCAN_SINCE" ]]; then args+=(--since "$SCAN_SINCE"); fi
          if [[ -n "$OLLAMA_MODEL" ]]; then
            args+=(--ollama-model "$OLLAMA_MODEL" --llm-budget-seconds 15000)
          fi
          status=0
          timeout --kill-after=10s 270m npm "${args[@]}" || status=$?
          if [[ "$status" = 124 || "$status" = 137 ]]; then
            echo '::error::メールの取得・選別が制限時間に達しました。保存済みの進捗をSQLに出力します。'
          fi
          if [[ "$status" != 0 ]]; then exit "$status"; fi
          jq -er 'if .complete then "complete=true" elif .remainingLlm > 0 then "complete=false" else error("Invalid selection result") end' \
            reports/dry-run.json >> "$GITHUB_OUTPUT"
      - name: Export ICS
        if: steps.selection.outputs.complete == 'true'
        run: npm run --silent calendar:ics -- --no-mail-details
      - name: Compare or register Google events
        if: steps.selection.outputs.complete == 'true'
        timeout-minutes: 10
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          operation=calendar:plan
          if [[ "$APPLY" = true ]]; then operation=calendar:register; fi
          npm run --silent "$operation" -- --database --no-mail-details

      - name: Dump and encrypt database snapshot
        if: ${{ !cancelled() && steps.load_database.outcome == 'success' }}
        id: dump_database
        env:
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          npm run db:dump
          snapshot=$(<db/dumps/latest.txt)
          mkdir -p "$DB_ARTIFACT_DIR"
          tar -C db/dumps -czf "$RUNNER_TEMP/calendar-db.tar.gz" latest.txt "$snapshot"
          printf '%s\n' "$GOOGLE_REFRESH_TOKEN" |
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric \
              --cipher-algo AES256 --output "$DB_ARTIFACT_DIR/calendar-db.tar.gz.gpg" "$RUNNER_TEMP/calendar-db.tar.gz"
          rm -f "$RUNNER_TEMP/calendar-db.tar.gz"
      - name: Upload latest SQL artifact
        id: upload_database
        if: ${{ !cancelled() && steps.dump_database.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: mail-calendar-sql-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DB_ARTIFACT_DIR }}/calendar-db.tar.gz.gpg
          if-no-files-found: error
          compression-level: 0
      - name: Delete previous SQL artifacts
        if: ${{ !cancelled() && steps.upload_database.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_ARTIFACT_ID: ${{ steps.upload_database.outputs.artifact-id }}
          OLD_ARTIFACT_IDS: ${{ steps.db_history.outputs.old_ids }}
        run: |
          [[ "$NEW_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          read -r -a old_ids <<< "$OLD_ARTIFACT_IDS"
          for id in "${old_ids[@]}"; do
            [[ "$id" =~ ^[0-9]+$ ]]
            if [[ "$id" != "$NEW_ARTIFACT_ID" ]]; then
              gh api --silent --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            fi
          done
      - name: Stop database
        if: always()
        run: npm run db:down
