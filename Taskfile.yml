version: '3'

tasks:
  db:setup:
    desc: パスワードなしでCompose起動→未適用マイグレーション適用
    cmds:
      - npm run db:up
      - npm run db:migrate
  db:import:
    desc: DB起動→マイグレーション→SQLダンプ一括復元（空DBのみ）
    cmds:
      - npm run db:up
      - npm run db:migrate
      - npm run db:restore
  calendar:sync:
    desc: 接続確認→メール取得・LLM選別→ICS出力→重複照合・Google登録を一括実行
    vars:
      MODEL: '{{default "qwen3.5:9b" .MODEL}}'
      SINCE: '{{default "" .SINCE}}'
      CALENDAR_ID: '{{default "primary" .CALENDAR_ID}}'
      MAILBOX: '{{default "INBOX" .MAILBOX}}'
    cmds:
      - npm run db:status
      - defer: npm run db:dump
      - npm run auth:status -- --calendar-id "{{.CALENDAR_ID}}"
      - >-
        npm run calendar:dry-run -- --database --ollama-model "{{.MODEL}}" --mailbox "{{.MAILBOX}}"
        {{if .SINCE}}--since "{{.SINCE}}"{{end}}
      - npm run calendar:ics
      - npm run calendar:register -- --database --calendar-id "{{.CALENDAR_ID}}"
  mail:review:
    desc: 接続確認→一覧→最新3件の本文取得を順番に実行
    cmds:
      - npm run mail:check
      - npm run mail:list
      - npm run mail:inspect
  verify:
    desc: 整形チェック・型チェック・テストを順番に実行
    cmds:
      - npm run format:check
      - npm run typecheck
      - npm test
