version: '3'

tasks:
  default:
    cmds:
      - task --list
  check:
    desc: Yahooメールの接続確認
    cmds:
      - npm run --silent cli -- check
  list:
    desc: 最新10件の一覧を表示
    cmds:
      - npm run --silent cli -- list
  show:
    desc: UIDを指定して本文を表示（npm run task -- show -- 123）
    cmds:
      - npm run --silent cli -- show {{.CLI_ARGS}}
  inspect:
    desc: 最新3件の本文を順番に表示
    cmds:
      - npm run --silent cli -- inspect
  mail:review:
    desc: 接続確認→一覧→最新3件の本文取得を順番に実行
    cmds:
      - task: check
      - task: list
      - task: inspect
  verify:
    desc: 整形チェック・型チェック・テストを順番に実行
    cmds:
      - npm run format:check
      - npm run typecheck
      - npm test
  format:
    desc: Prettierでファイルを整形
    cmds:
      - npm run format
  format:check:
    desc: Prettierで整形済みか確認
    cmds:
      - npm run format:check
  calendar:dry-run:
    desc: 先月初日以降のメールから予定候補を抽出（登録しない）
    cmds:
      - npm run --silent cli -- dry-run
  calendar:audit-forwards:
    desc: Gmail宛の転送済みメールを取得して判定を監査（送信・登録なし）
    cmds:
      - npm run --silent cli -- audit-forwards
  auth:login:
    desc: Google OAuthをブラウザーで認証
    cmds:
      - npm run --silent cli -- auth login
  auth:status:
    desc: Google Calendar APIへの接続確認
    cmds:
      - npm run --silent cli -- auth status
  calendar:plan:
    desc: 選別済み候補をGoogleの既存予定と照合（書き込まない）
    cmds:
      - npm run --silent cli -- calendar sync
  calendar:register:
    desc: 重複していない未来の確定候補をGoogleカレンダーへ登録
    cmds:
      - npm run --silent cli -- calendar sync --apply
  calendar:ics:
    desc: 選別済み候補をICSファイルへ出力
    cmds:
      - npm run --silent cli -- calendar export-ics
